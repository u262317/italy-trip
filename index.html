<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Italy Trip Itinerary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --stone: #E6E1D4;
    --stone-deep: #D7D0BC;
    --card-bg: #FBF8EF;
    --ink: #21283B;
    --ink-soft: #5B5647;
    --pompeian: #B4552A;
    --verdigris: #3C6E71;
    --gold: #A9852E;
    --line: #CDC6AE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --stone: #171B26;
      --stone-deep: #1F2433;
      --card-bg: #232838;
      --ink: #EDE4C8;
      --ink-soft: #A79F86;
      --pompeian: #D97A45;
      --verdigris: #6FA6A0;
      --gold: #D4AF4A;
      --line: #333A4D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stone);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: 'Cormorant Garamond', Georgia, serif; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 60px; }

  .hero {
    position: relative;
    margin: 0 -20px 28px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px 20px 28px;
    background:
      linear-gradient(180deg, rgba(20,22,30,0.15) 0%, rgba(20,22,30,0.75) 100%),
      url('https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Basilica_di_San_Pietro_in_Vaticano_September_2015-1a.jpg/1280px-Basilica_di_San_Pietro_in_Vaticano_September_2015-1a.jpg') center/cover no-repeat;
    color: #F6F0DF;
  }
  @media (min-width: 800px) { .hero { margin: 0 0 28px; border-radius: 0 0 6px 6px; } }
  h1 { font-size: 2.6rem; font-weight: 700; margin: 0 0 4px; text-align: center; letter-spacing: 0.01em; }
  .subtitle { font-size: 0.9rem; text-align: center; letter-spacing: 0.08em; opacity: 0.9; }
  .subtitle::before, .subtitle::after { content: "—"; margin: 0 8px; opacity: 0.6; }

  .tabs {
    display: flex; gap: 26px; overflow-x: auto;
    padding: 0 2px 12px; margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    flex: 0 0 auto; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-soft);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem; font-weight: 600;
    padding: 4px 4px 12px; cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { color: var(--pompeian); border-bottom-color: var(--pompeian); }

  .day-panel { display: none; }
  .day-panel.active { display: block; }
  .day-title { font-size: 1.6rem; margin: 0 0 6px; }

  .timeline { position: relative; margin-top: 4px; }
  .timeline::before {
    content: ""; position: absolute; left: 62px; top: 6px; bottom: 6px;
    width: 1px; background: var(--line);
  }
  .stop { position: relative; display: flex; gap: 18px; padding: 16px 0; }
  .time-col {
    flex: 0 0 62px; text-align: right; padding-right: 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600; font-size: 1.15rem; color: var(--ink-soft);
    position: relative;
  }
  .dot {
    position: absolute; right: -4px; top: 5px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pompeian); border: 2px solid var(--stone);
  }
  .content {
    flex: 1; min-width: 0;
    border-left: 2px solid var(--line);
    padding: 4px 0 4px 16px;
  }
  .content.key { border-left-color: var(--pompeian); }
  .content h3 { margin: 0 0 3px; font-size: 1.15rem; font-weight: 600; color: var(--ink); }
  .content p { margin: 0; font-size: 0.88rem; color: var(--ink-soft); line-height: 1.55; }
  .photo {
    display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover;
    border-radius: 4px; margin: 0 0 10px; background: var(--stone-deep);
  }
  .tag {
    display: inline-block; font-size: 0.72rem; font-weight: 600;
    color: var(--verdigris); margin-bottom: 3px; letter-spacing: 0.02em;
  }

  section.notes {
    margin-top: 30px; background: var(--card-bg);
    border-top: 2px solid var(--gold);
    padding: 18px 18px 6px; border-radius: 0 0 4px 4px;
  }
  section.notes h2 { font-size: 1.3rem; margin: 0 0 12px; font-weight: 600; }
  section.notes ul { margin: 0; padding-left: 18px; font-size: 0.88rem; color: var(--ink-soft); }
  section.notes li { margin-bottom: 9px; }

  .t-note { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 14px; }
  .tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding-bottom: 14px; }
  .ticket { background: #fff; border-radius: 6px; padding: 10px 10px 12px; text-align: center; color: #21283B; border: 1px solid var(--line); }
  .ticket img { width: 100%; max-width: 220px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
  .t-name { font-weight: 600; font-size: 0.95rem; }
  .t-code { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; color: #5B5647; letter-spacing: 0.03em; }
  footer { text-align: center; color: var(--ink-soft); font-size: 0.72rem; margin-top: 40px; }
  footer .credits { margin-top: 10px; line-height: 1.7; }
  footer a { color: var(--ink-soft); }

  @media (max-width: 480px) {
    .timeline::before { left: 52px; }
    .time-col { flex-basis: 52px; padding-right: 12px; font-size: 1rem; }
    .stop { gap: 12px; }
    .content { padding-left: 12px; }
    h1 { font-size: 2.1rem; }
  }

  .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock form { width: 100%; max-width: 340px; background: var(--card-bg); border-top: 2px solid var(--gold); padding: 28px 24px; border-radius: 0 0 6px 6px; text-align: center; }
  .lock h1 { font-size: 2rem; margin: 0 0 4px; color: var(--ink); }
  .lock p { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 18px; }
  .lock input { width: 100%; padding: 11px 12px; font: inherit; border: 1px solid var(--line); border-radius: 4px; background: var(--stone); color: var(--ink); margin-bottom: 10px; }
  .lock button { width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 4px; background: var(--pompeian); color: #fff; cursor: pointer; }
  .lock .err { color: var(--pompeian); font-size: 0.8rem; min-height: 1.2em; margin: 10px 0 0; }
  .lock label { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 12px; }
  .lock label input { width: auto; margin: 0; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="f">
    <h1>Italy Trip</h1>
    <p>This itinerary is private. Enter the password to view it.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

function b(s) { return Uint8Array.from(atob(s), function(c) { return c.charCodeAt(0); }); }
async function unlock(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(DATA.iv) }, key, b(DATA.ct));
  document.body.innerHTML = new TextDecoder().decode(pt);
  run();
}
function run() {
  var buttons = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.day-panel');
  function show(id) {
    buttons.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-day') === id); });
    panels.forEach(function(p) { p.classList.toggle('active', p.id === id); });
  }
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-day');
      show(id);
      history.replaceState(null, '', '#' + id);
    });
  });
  if (location.hash && document.getElementById(location.hash.slice(1))) show(location.hash.slice(1));
}
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
(function() {
  var saved = null; try { saved = localStorage.getItem('italy-pw'); } catch (e) {}
  if (saved) unlock(saved).catch(function() { store('italy-pw', null); });
})();
document.getElementById('f').addEventListener('submit', function(e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value, rem = document.getElementById('remember').checked;
  document.getElementById('err').textContent = 'Unlocking…';
  unlock(pw).then(function() { if (rem) store('italy-pw', pw); })
    .catch(function() { document.getElementById('err').textContent = 'Wrong password — try again.'; });
});
</script>
